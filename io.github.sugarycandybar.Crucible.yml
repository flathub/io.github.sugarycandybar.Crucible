app-id: io.github.sugarycandybar.Crucible
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: crucible
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=/sys:ro
modules:
  - name: stress-ng
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS
      - install -Dm755 stress-ng /app/bin/stress-ng
    sources:
      - type: archive
        url: https://github.com/ColinIanKing/stress-ng/archive/refs/tags/V0.22.02.tar.gz
        sha256: 860004ce7484311b3296fc52796fbbc34dfb7f644a769bbd4e03935b7a1b0ccb
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ColinIanKing/stress-ng/releases/latest
          tag-query: .tag_name
          version-query: .tag_name | ltrimstr("V")
          url-query: .tarball_url
          timestamp-query: .published_at
  - name: crucible
    buildsystem: meson
    build-options:
      prepend-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/crucible/cargo
    sources:
      - type: git
        url: https://github.com/sugarycandybar/Crucible.git
        commit: 398a3763d60f1efdef790d229a3be3f3f61f1028
      - generated-sources.json
